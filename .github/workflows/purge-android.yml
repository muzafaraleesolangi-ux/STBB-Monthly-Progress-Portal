name: Remove Old Android APK Releases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-android.yml'
permissions:
  contents: write
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1.0.0 and v1.0.1 APK releases, tags and generated artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            for(const tag of ['android-v1.0.0','android-v1.0.1']){
              try{
                const release=await github.rest.repos.getReleaseByTag({owner,repo,tag});
                await github.rest.repos.deleteRelease({owner,repo,release_id:release.data.id});
                core.info('Deleted APK release '+tag);
              }catch(e){if(e.status!==404)throw e;}
              try{
                await github.rest.git.deleteRef({owner,repo,ref:'tags/'+tag});
              }catch(e){if(e.status!==404&&e.status!==422)throw e;}
            }
            const arts=await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,per_page:100});
            for(const a of arts){
              if(a.name==='STBB-Monthly-Progress-Android'){
                await github.rest.actions.deleteArtifact({owner,repo,artifact_id:a.id});
                core.info('Deleted Android build artifact '+a.id);
              }
            }
