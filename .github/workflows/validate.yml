name: Validate Portal Javascript
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external JavaScript syntax
        run: |
          node --check portal-ux.js
          node --check editor-ux.js
          node --check premium-home-v2.js
          node --check whatsapp-recovery-v2.js
          node --check studio-core-v2.js
          node --check admin-schools-v2.js
          node --check home-navigation-v3.js
          node --check progress-guidance-v4.js
          node --check teacher-workspace-v1.js
          node --check school-staff-v1.js
          node --check staff-ux-v2.js
          node --check hm-teacher-admin-v1.js
      - name: Install browser DOM test dependencies
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Test classwise teacher subject allocations
        run: |
          node --check tests/studio-assignments.test.cjs
          node tests/studio-assignments.test.cjs
          node --check tests/lesson-progress-and-xlsx.test.cjs
          node tests/lesson-progress-and-xlsx.test.cjs
          node tests/excel-delivery.test.cjs
          node --check tests/visible-export-ui.test.cjs
          node tests/visible-export-ui.test.cjs
          node --check tests/mobile-preview.test.cjs
          node tests/mobile-preview.test.cjs
          node --check fresh-experience-v2.js
          node tests/original-master-xlsx.test.cjs
          node --check tests/teacher-self-service.test.cjs
          node tests/teacher-self-service.test.cjs
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for path in ['index.html','MPR_Online_Editor.html']:
              content=Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',content,re.I|re.S)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise RuntimeError('Missing inline app code in '+path)
              for i,script in enumerate(inline):
                  Path('code_'+path.replace('.html','')+'_'+str(i)+'.js').write_text(script)
          PY
          for f in code_*.js; do node --check "$f"; done
      - name: Validate portal linked resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          e=Path('MPR_Online_Editor.html').read_text(encoding='utf-8')
          assert 'id="newMonthName"' in h
          assert 'id="newMonthYear"' in h
          assert 'id="saveDialog"' in h
          assert 'id="saveFloat"' in h
          for file in ('portal-ux.css','portal-ux.js','editor-ux.css','editor-ux.js','premium-home-v2.css','premium-home-v2.js','studio-v2.css','studio-core-v2.js','report-premium-v4.css','progress-guidance-v4.js','admin-schools-v2.css','admin-schools-v2.js','whatsapp-recovery-v2.css','whatsapp-recovery-v2.js','home-navigation-v3.js','home-navigation-v3.css','teacher-workspace-v1.js','teacher-workspace-v1.css','school-staff-v1.js','school-staff-v1.css','staff-ux-v2.js','hm-teacher-admin-v1.js','unified-school-v1.css'):
            assert Path(file).is_file()
          assert 'portal-ux.js' in h
          assert 'editor-ux.js' in e
          for name in ('premium-home-v2.js','studio-core-v2.js','admin-schools-v2.js','whatsapp-recovery-v2.js','home-navigation-v3.js','school-staff-v1.js','hm-teacher-admin-v1.js'):
            assert name in h
          assert 'pattern="[0-9]{6,13}"' not in h
          assert 'id="hmOfficeForm"' not in h
          assert "request('signin',formObj(e.target),false)" in h
          assert 'id="school-teachers"' in h and 'id="teacherdash"' in h
          assert 'unified-school-v1.css' in h
          assert 'school-staff-v1.js' in h
          print('Portal static validation successful.')
          PY
