name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Compile, verify and publish Android
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK on GitHub runner
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android APK
        run: gradle -p android-app --no-daemon :app:assembleDebug
      - name: Verify signing, package and permissions
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          cp "$APK" STBB-Monthly-Progress.apk
          sha256sum STBB-Monthly-Progress.apk | tee STBB-Monthly-Progress.sha256
      - name: Attach APK as GitHub Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: STBB-Monthly-Progress-Android
          path: |
            STBB-Monthly-Progress.apk
            STBB-Monthly-Progress.sha256
          retention-days: 90
      - name: Publish direct-download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: STBB Monthly Progress Android v1.0.0
          files: |
            STBB-Monthly-Progress.apk
            STBB-Monthly-Progress.sha256
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            STBB Monthly Progress Android app — build v1.0.0

            School login: existing SEMIS + school password.
            Native Home / Teachers / Months / History shortcuts.
            Official hosted web portal and cloud reports remain unchanged.
            Excel files are saved with Android's system file picker.
            Online connection required.

            This APK is signed with the standard Android debug signing key for sideloading/testing.
            This is not a Google Play release; a production release needs private signing credentials.
